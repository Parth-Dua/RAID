# Local development datastore only. `docker compose -f docker/docker-compose.yml up -d`
# then run `pnpm db:migrate` and `pnpm dev` from the repo root. See docs/DEPLOYMENT.md.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raid_dev
    ports:
      - "5432:5432"
    volumes:
      - raid_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  raid_pg_data:
